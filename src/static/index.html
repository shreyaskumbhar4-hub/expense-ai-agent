<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense AI — Personal Expense Assistant</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 680px;
            height: 90vh;
            max-height: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        header {
            padding: 20px 24px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 28px;
            background: #e0e7ff;
            padding: 8px;
            border-radius: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        header p {
            margin: 2px 0 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafafa;
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.ai .bubble {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-top-left-radius: 4px;
        }

        .message.user .bubble {
            background: var(--primary);
            color: white;
            border-top-right-radius: 4px;
        }

        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid var(--border-color);
        }

        form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        select {
            padding: 0 8px;
            height: 46px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #f1f5f9;
            color: var(--text-main);
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            background: #e2e8f0;
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        #mic-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        #mic-btn:hover {
            background: #e2e8f0;
        }

        #mic-btn.recording {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
            animation: pulse 1.5s infinite;
        }

        #speaker-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        #speaker-btn:hover {
            background: #e2e8f0;
        }

        #speaker-btn.active {
            background: #e0e7ff;
            color: var(--primary);
            border-color: #c7d2fe;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #send-button {
            background: var(--primary);
            color: white;
            padding: 0 18px;
            height: 46px;
            font-weight: 600;
        }

        #send-button:hover {
            background: var(--primary-hover);
        }

        #send-button:disabled, #mic-btn:disabled, #speaker-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 650px) {
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <header>
        <div class="header-icon">💰</div>
        <div>
            <h1>Expense AI Assistant</h1>
            <p>Track expenses, budgets, and insights with voice or text</p>
        </div>
    </header>

    <main id="messages">
        <div class="message ai">
            <div class="bubble">Hi! I’m your expense assistant. Type or speak to record expenses or check your totals!</div>
        </div>
    </main>

    <div class="input-area">
        <form id="chat-form">
            <input
                id="message-input"
                type="text"
                placeholder="Type or click 🎤 to speak..."
                autocomplete="off"
                required
            >
            <button id="mic-btn" class="action-btn" type="button" title="Voice Input">🎤</button>
            <button id="speaker-btn" class="action-btn" type="button" title="Text-to-Speech (Muted)">🔇</button>
            <select id="voice-select" title="Choose Voice Gender">
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>
            <button id="send-button" class="action-btn" type="submit" style="width: auto;">Send</button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const micButton = document.getElementById("mic-btn");
    const speakerButton = document.getElementById("speaker-btn");
    const voiceSelect = document.getElementById("voice-select");
    const messages = document.getElementById("messages");

    const USER_ID = 1;

    function addMessage(text, sender) {
        const message = document.createElement("div");
        message.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        message.appendChild(bubble);
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    }

    // --- Voice Recognition (Speech-to-Text) ---
    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            input.value = transcript;
            stopRecordingState();
        };

        recognition.onerror = function(event) {
            console.error("Speech recognition error", event.error);
            stopRecordingState();
        };

        recognition.onend = function() {
            stopRecordingState();
        };
    } else {
        micButton.style.display = 'none';
    }

    function startRecordingState() {
        isRecording = true;
        micButton.classList.add("recording");
        micButton.title = "Listening...";
    }

    function stopRecordingState() {
        isRecording = false;
        micButton.classList.remove("recording");
        micButton.title = "Voice Input";
        try { recognition.stop(); } catch(e) {}
    }

    micButton.addEventListener("click", () => {
        if (!recognition) {
            alert("Voice input is not supported in this browser.");
            return;
        }

        if (isRecording) {
            stopRecordingState();
        } else {
            startRecordingState();
            try {
                recognition.start();
            } catch (err) {
                console.error(err);
                stopRecordingState();
            }
        }
    });

    // --- Text-to-Speech (Speaker Toggle & Voice Selection) ---
    let isAudioEnabled = false;
    let systemVoices = [];

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        systemVoices = window.speechSynthesis.getVoices();
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function toggleSpeaker() {
        isAudioEnabled = !isAudioEnabled;
        if (isAudioEnabled) {
            speakerButton.textContent = "🔊";
            speakerButton.classList.add("active");
            speakerButton.title = "Text-to-Speech (Enabled)";
        } else {
            speakerButton.textContent = "🔇";
            speakerButton.classList.remove("active");
            speakerButton.title = "Text-to-Speech (Muted)";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    }

    speakerButton.addEventListener("click", toggleSpeaker);

    function getSelectedVoice() {
        if (!systemVoices.length) loadVoices();
        const preference = voiceSelect.value; // 'female' or 'male'

        // Filter English voices
        const englishVoices = systemVoices.filter(v => v.lang.startsWith('en'));
        const voicesToSearch = englishVoices.length ? englishVoices : systemVoices;

        // Try to heuristically match female or male voice names provided by the OS/browser
        let matchedVoice = voicesToSearch.find(v => {
            const name = v.name.toLowerCase();
            if (preference === 'female') {
                return name.includes('female') || name.includes('zira') || name.includes('samantha') || name.includes('victoria') || name.includes('karen') || name.includes('hazel') || name.includes('aria') || name.includes('jenny');
            } else {
                return name.includes('male') || name.includes('david') || name.includes('mark') || name.includes('george') || name.includes('james') || name.includes('ryan') || name.includes('guy');
            }
        });

        // Fallback to the first available voice if specific keywords aren't found
        if (!matchedVoice && voicesToSearch.length > 0) {
            matchedVoice = voicesToSearch[preference === 'female' ? 0 : Math.min(1, voicesToSearch.length - 1)];
        }

        return matchedVoice;
    }

    function speakText(text) {
        if (!isAudioEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // Stop any ongoing speech
        
        const utterance = new SpeechSynthesisUtterance(text);
        const voice = getSelectedVoice();
        if (voice) {
            utterance.voice = voice;
        }
        utterance.rate = 1.0;
        utterance.pitch = voiceSelect.value === 'female' ? 1.2 : 0.9; // Slight pitch tuning
        
        window.speechSynthesis.speak(utterance);
    }

    // --- Chat Form Submission ---
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (isRecording) {
            stopRecordingState();
        }

        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");

        input.value = "";
        sendButton.disabled = true;
        input.disabled = true;
        micButton.disabled = true;

        addMessage("Thinking...", "ai");
        const thinkingBubble = messages.lastElementChild.querySelector(".bubble");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: USER_ID,
                    message: message
                })
            });

            if (!response.ok) {
                throw new Error("Server error"); 
                
            }

            const data = await response.json();
            thinkingBubble.textContent = data.response;

            // Speak response if audio is enabled
            speakText(data.response);

        } catch (error) {
            thinkingBubble.textContent = "Sorry, I couldn't connect to the server.";
            console.error(error);

        } finally {
            sendButton.disabled = false;
            input.disabled = false;
            micButton.disabled = false;
            input.focus();
        }
    });
</script>

</body>
</html>
